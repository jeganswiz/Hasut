# HASUT local infrastructure
name: hasut

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: hasut
      POSTGRES_PASSWORD: hasut
      POSTGRES_DB: hasut
    ports:
      - "5432:5432"
    volumes:
      - hasut_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hasut -d hasut"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hasut
      MINIO_ROOT_PASSWORD: hasutsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hasut_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "sleep 3 && mc alias set local http://minio:9000 hasut hasutsecret && mc mb --ignore-existing local/hasut-media",
      ]

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    ports:
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ../mediamtx/mediamtx.yml:/mediamtx.yml:ro
    profiles: ["live"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      APP_NAME: hasut-api
      APP_VERSION: 0.0.0
      PORT: 3001
      API_PREFIX: api/v1
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hasut:hasut@postgres:5432/hasut?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002
      SENTRY_DSN: ""
      OTP_PROVIDER: console
      JWT_ACCESS_SECRET: hasut-dev-access-secret-32chars-min
      JWT_REFRESH_SECRET: hasut-dev-refresh-secret-32chars-min
      GEOCODER_PROVIDER: console
      MEDIA_STORAGE: memory
      LIVE_HLS_BASE_URL: http://127.0.0.1:8888
      LIVE_WHIP_BASE_URL: http://127.0.0.1:8889
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  hasut_postgres:
  hasut_minio:
